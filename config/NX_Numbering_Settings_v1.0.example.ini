; Сохраните рядом с NX_Number_Program_Folders.cs как NX_Numbering_Settings_v1.0.ini.
; UTF-8. Диапазон ниже — пример. До первого запуска назначьте свой диапазон,
; не пересекающийся с номерами других программистов и ранее выданными номерами.
; Существующий реестр никогда не заменяйте пустым шаблоном.
[Numbering]
; Латинская заглавная буква перед номером: O, например O1659.
Prefix=O
; Первый номер вашего диапазона. Перед первым запуском задайте свой.
StartNumber=1
; Последний допустимый номер включительно.
EndNumber=1000
; Имя существующего Excel-реестра. Относительный путь считается от папки INI.
RegistryFile=NX_Numbering_Register_v1.0.xlsx
