; Сохраните как NX_Update_Scripts.ini рядом с апдейтером.
; Существующий личный INI этим примером не заменяйте.
[Paths]
working_folder=C:\ProgramData\NX_SCRIPTS
update_folder=

[Source]
type=github
manifest_url=https://raw.githubusercontent.com/TonyFoxxxx/NXOpen-SCRIPTS/main/manifest.json

[Options]
search_update_subfolders=yes
search_working_subfolders=no
; Старое исключение относится к режиму folder. GitHub включает апдейтер отдельно.
exclude_files=NX_Update_Scripts*.py
