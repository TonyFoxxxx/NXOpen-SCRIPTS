; Сохраните как NX_Postprocess_To_Machine.ini рядом с CS. UTF-8.
; Все пути ниже вымышленные: замените их своими до запуска обработки.
; После редактирования нажмите «Обновить» в меню скрипта.
[Settings]
DefaultExtension=.ptp
; auto — добавить посты NX; пустое значение — только явно заданные посты.
PostList=auto

[MachineRoots]
; Корневая папка с подпапками станков.
Пример цеха=C:\CNC_Example\Machines

[Machines]
Пример станка=C:\CNC_Example\Machine_1

[Post FANUC_3_AXIS]
Tcl=C:\CNC_Example\Posts\Fanuc_3Axis.tcl
Def=C:\CNC_Example\Posts\Fanuc_3Axis.def
Extension=.ptp
